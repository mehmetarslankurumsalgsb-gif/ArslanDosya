name: APK Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Görüntüleyici kütüphanelerini indir
        run: bash scripts/kutuphaneleri-indir.sh

      - name: APK oluştur
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK dosyasını hazırla
        run: cp app/build/outputs/apk/debug/app-debug.apk ArslanDosya.apk

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: ArslanDosya
          path: ArslanDosya.apk
